<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1530" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B13"/>
      <stop offset=".48" stop-color="#0D1425"/>
      <stop offset="1" stop-color="#11182D"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="0" x2="1460" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6FF3B"/>
      <stop offset=".35" stop-color="#38BDF8"/>
      <stop offset=".68" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="blue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lime" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3FF12" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A3FF12" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 .035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>

  <g opacity=".11">
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600" stroke="#94A3B8"/>
    <path d="M120 0V520M320 0V520M520 0V520M720 0V520M920 0V520M1120 0V520M1320 0V520M1520 0V520" stroke="#94A3B8"/>
  </g>

  <ellipse cx="220" cy="125" rx="360" ry="260" fill="url(#blue)" filter="url(#blur)">
    <animate attributeName="cx" values="220;390;220" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="125;180;125" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1320" cy="370" rx="420" ry="300" fill="url(#violet)" filter="url(#blur)">
    <animate attributeName="cx" values="1320;1190;1320" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="370;300;370" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="930" cy="80" rx="260" ry="190" fill="url(#lime)" filter="url(#blur)">
    <animate attributeName="cx" values="930;1040;930" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <rect width="1600" height="520" rx="34" filter="url(#grain)" opacity=".45"/>

  <g>
    <rect x="72" y="58" width="250" height="48" rx="24" fill="#0A1020" stroke="#273449"/>
    <circle cx="98" cy="82" r="7" fill="#A3FF12">
      <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="119" y="90" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2">BITS OF DANYA</text>
  </g>

  <text x="72" y="221" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="-3">DANIIL CHEPKO</text>
  <text x="76" y="280" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">ML ENGINEER · SOFTWARE ENGINEER · TECH LEAD</text>

  <text x="76" y="340" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">
    Production ML · Backend · Web · Mobile · Systems
  </text>

  <g transform="translate(1080 88)">
    <rect width="414" height="286" rx="28" fill="#080E19" stroke="#273449"/>
    <text x="28" y="44" fill="#64748B" font-family="Courier New, monospace" font-size="16" letter-spacing="1">CURRENT SIGNAL</text>

    <text x="28" y="93" fill="#F8FAFC" font-family="Courier New, monospace" font-size="19" font-weight="700">BUILDING</text>
    <text x="170" y="93" fill="#A3FF12" font-family="Courier New, monospace" font-size="19">products / systems</text>

    <text x="28" y="136" fill="#F8FAFC" font-family="Courier New, monospace" font-size="19" font-weight="700">CORE</text>
    <text x="170" y="136" fill="#38BDF8" font-family="Courier New, monospace" font-size="19">ML + software</text>

    <text x="28" y="179" fill="#F8FAFC" font-family="Courier New, monospace" font-size="19" font-weight="700">MODE</text>
    <text x="170" y="179" fill="#C4B5FD" font-family="Courier New, monospace" font-size="19">0 → 1 → prod</text>

    <path d="M28 220H386" stroke="#263349" stroke-width="2"/>
    <circle cx="43" cy="248" r="7" fill="#38BDF8">
      <animate attributeName="cx" values="43;370;43" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M43 248H370" stroke="#334155" stroke-width="2" stroke-dasharray="7 9"/>
  </g>

  <path d="M72 421H1494" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/>
  </path>

  <text x="72" y="468" fill="#64748B" font-family="Courier New, monospace" font-size="18" font-weight="700" letter-spacing="1">
    RESEARCH → ARCHITECTURE → ENGINEERING → PRODUCTION
  </text>
</svg>